name: Daily blog drip (M-F, ~6 AM MT)

# ScheduleOS job type `content-drip` (intake ADD-ITEM, item home = this file; identity = repo + post date).
#
# The site is static HTML generated by tools/build.mjs from content/**.json. Blog posts carry a `date`;
# the generator only writes posts dated on or before "today" (America/Denver) and removes any future
# post it finds on disk, and tools/build-sitemap.js leaves future posts out of sitemap.xml. So a post
# goes live when a build runs on or after its date. This workflow is that daily build: it runs the
# generator and, only if the output changed, commits it to main; Vercel deploys main.
#
# Reliability (same model as the fleet's other drips):
#   * GitHub crons are best-effort, so two crons (one per DST offset) both run; the second is a no-op
#     because an unchanged build commits nothing.
#   * Off-peak minutes (:17 / :23), never :00.
#   * A missed day self-heals: the next build publishes every post that is due.
#   * `verify` checks today's posts are live and alerts Telegram if not (set TELEGRAM_BOT_TOKEN +
#     TELEGRAM_CHAT_ID repo secrets to arm it; until then it logs). It never fails the run.
#   * Manual catch-up: `gh workflow run daily-drip.yml`.

on:
  schedule:
    - cron: '17 12 * * 1-5'   # ~06:17 MDT (Mar-Nov)
    - cron: '23 13 * * 1-5'   # ~06:23 MST (Nov-Mar)
  workflow_dispatch: {}

concurrency:
  group: daily-drip
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # full history: sitemap lastmod is each content file's last commit date

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build (date-gated) and gate
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Denver date +%F)"
          node tools/build.mjs --today "$TODAY"
          node tools/check.js --today "$TODAY"

      - name: Commit the day's output if anything changed
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No post due today and nothing changed - nothing to publish."
            exit 0
          fi
          git config user.name "Divinely Faded drip bot"
          # Must be the verified Vercel deploying identity, or Vercel's Git-author protection skips the deploy.
          git config user.email "peytonwoodscampbell97@gmail.com"
          git commit -m "chore(drip): publish posts due $(TZ=America/Denver date +%F)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            if git push origin HEAD:main; then echo "Pushed; Vercel deploys main."; exit 0; fi
            echo "Push attempt ${attempt} failed - retrying."
          done
          echo "Failed to push after retries." >&2
          exit 1

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify today's posts are live, else alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          TODAY="$(TZ=America/Denver date +%F)"
          SITE="$(node -e 'console.log(require("./content/facts.json").site_url.replace(/\/$/, ""))')"
          mapfile -t SLUGS < <(node -e '
            const fs = require("fs"), path = require("path"), today = process.argv[1];
            for (const loc of ["en", "es"]) { const d = path.join("content/blog", loc); if (!fs.existsSync(d)) continue;
              for (const f of fs.readdirSync(d)) { if (!f.endsWith(".json")) continue; const p = JSON.parse(fs.readFileSync(path.join(d, f), "utf8")); if (p.date === today) console.log(p.slug); } }' "$TODAY")
          if [ "${#SLUGS[@]}" -eq 0 ]; then echo "No post dated ${TODAY}."; exit 0; fi
          alert() {
            echo "ALERT: $1"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -s -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$1" >/dev/null || true
            else echo "(Telegram secrets unset - alert not sent)"; fi
          }
          for slug in "${SLUGS[@]}"; do
            url="${SITE}${slug}"; ok=0
            for i in $(seq 1 12); do
              code="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -L "$url" || echo 000)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "  ${slug}: not live yet (try ${i}/12: status=${code})"; sleep 60
            done
            if [ "$ok" -eq 1 ]; then echo "OK: ${url} is live."
            else alert "Divinely Faded blog drip ${TODAY}: ${url} is not live (status=${code}). Fix: gh workflow run daily-drip.yml --repo colin0217/Divinely_Faded"; fi
          done
          exit 0
